name: iOS

# Builds the app and runs simulator tests on a macOS runner.
#
# Standard GitHub-hosted runners are free for public repositories, which is why
# this runs on every push. If the repository becomes private, included compute
# is about 193 macOS minutes a month, so change the triggers below to
# workflow_dispatch and tags only. See docs/IOS_BUILD.md.
#
# No Apple Developer Program membership is needed for anything here: signing and
# TestFlight arrive in Milestone 3. Simulator builds are unsigned.
on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - "packages/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "packages/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        # The image's default Xcode is older than the iOS SDK the app needs:
        # it shipped Xcode 16.4 (Swift 6.1) while carrying iOS 26 simulator
        # runtimes. Selecting the newest installed Xcode gets the matching SDK
        # without depending on a runner label that may not exist yet.
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$newest" ]; then
            echo "No Xcode found in /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$newest/Contents/Developer"
          echo "Selected $newest"
          xcodebuild -version
          swift --version

      - name: Show available simulator runtimes
        # Recorded so a failure caused by a runner image change is obvious.
        run: xcrun simctl list runtimes | grep -i ios || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        # The .xcodeproj is generated rather than committed, so it can be
        # edited as text. See docs/IOS_BUILD.md.
        working-directory: ios
        run: |
          xcodegen generate
          test -d Tokino.xcodeproj

      - name: Choose a simulator
        id: simulator
        # Discovered rather than hardcoded: a device name like 'iPhone 17'
        # breaks silently whenever the runner image changes its pre-created
        # devices.
        run: echo "udid=$(./scripts/ios-simulator-udid.sh 26)" >> "$GITHUB_OUTPUT"

      - name: Build and test on a simulator
        working-directory: ios
        # CODE_SIGNING_ALLOWED=NO because a simulator build needs no signing,
        # and signing would require an Apple Developer account we do not yet have.
        run: |
          set -o pipefail
          xcodebuild test \
            -project Tokino.xcodeproj \
            -scheme Tokino \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          # An explicit -resultBundlePath rather than hunting through
          # DerivedData, whose layout varies and which is empty when the build
          # fails before running tests.
          path: ios/TestResults.xcresult
          retention-days: 5
          if-no-files-found: ignore
