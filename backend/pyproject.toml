[project]
name = "tokino-api"
version = "0.1.0"
description = "Tokino backend: AI orchestration, place matching and publishing."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Database tests are skipped automatically when no test cluster is reachable,
# so `pytest` works on a laptop with nothing running.
markers = ["db: requires a Postgres test cluster"]

# Lint configuration lives in the repository root (ruff.toml) so backend/ and
# tools/ are held to the same rules. A [tool.ruff] block here would silently
# override it for these files.
