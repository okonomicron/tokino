[project]
name = "tokino-api"
version = "0.1.0"
description = "Tokino backend: AI orchestration, place matching and publishing."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Database tests are skipped automatically when no test cluster is reachable,
# so `pytest` works on a laptop with nothing running.
markers = ["db: requires a Postgres test cluster"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Selected explicitly rather than left to ruff's defaults, so a new ruff
# release cannot fail CI by enabling a rule we never opted into. CI pins the
# ruff version too, so local and CI runs agree.
select = ["E", "F", "I", "UP", "B", "RUF"]
